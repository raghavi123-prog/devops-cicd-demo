steps:
  # STEP 1: Unit Testing Gate
  - name: 'python:3.9-slim'
    id: 'unit-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --no-cache-dir -r requirements.txt
        pytest test_app.py

  # STEP 2: Static Code Security Scan (SAST with Bandit)
  - name: 'python:3.9-slim'
    id: 'sast-code-scan'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --no-cache-dir bandit
        bandit -r app.py -lll

  # STEP 3: Build Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-docker-image'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/demo-repo/flask-app:$COMMIT_SHA'
      - '.'

  # STEP 4: Container Vulnerability Scan (Trivy)
  - name: 'aquasec/trivy:latest'
    id: 'container-image-scan'
    args:
      - 'image'
      - '--exit-code'
      - '1'
      - '--severity'
      - 'CRITICAL,HIGH'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/demo-repo/flask-app:$COMMIT_SHA'

  # STEP 5: Push Image (Executes ONLY if Step 4 passes cleanly)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-to-registry'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/demo-repo/flask-app:$COMMIT_SHA'

  # STEP 6: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'flask-live-app'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/demo-repo/flask-app:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY
