steps:
  # Step 1: Install dependencies and run tests in one environment
  - name: 'python:3.9-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --no-cache-dir -r requirements.txt
        pytest test_app.py

  # Step 2: Build the Docker image once tests pass
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcp-devops-demo:$COMMIT_SHA'
      - '.'

options:
  logging: CLOUD_LOGGING_ONLY
