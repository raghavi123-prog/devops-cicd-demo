steps:
  # 1. Build the Flask Container Image tagged with the Commit SHA
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-flask-image'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/dev-docker-repo/flask-app:$COMMIT_SHA'
      - '.'

  # 2. Scan the Image for Vulnerabilities using Trivy
  - name: 'aquasec/trivy:latest'
    id: 'scan-image'
    args:
      - 'image'
      - '--severity'
      - 'CRITICAL'
      - '--exit-code'
      - '0'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/dev-docker-repo/flask-app:$COMMIT_SHA'

  # 3. Push the Immutable Image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/dev-docker-repo/flask-app:$COMMIT_SHA'

  # 4. Deploy Infrastructure to DEV using Terraform
  - name: 'hashicorp/terraform:latest'
    id: 'terraform-dev'
    entrypoint: 'sh'
    timeout: '1200s'
    args:
      - '-c'
      - |
        cd terraform/environments/dev
        echo "=== INITIALIZING TERRAFORM DEV ==="
        terraform init
        echo "=== APPLYING DEV INFRASTRUCTURE ==="
        terraform apply -var="project_id=$PROJECT_ID" -lock=false -auto-approve
        echo "=== DISPLAYING DEV OUTPUTS ==="
        terraform output
        echo "=== TEARING DOWN DEV INFRASTRUCTURE ==="
        terraform destroy -var="project_id=$PROJECT_ID" -lock=false -auto-approve

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/dev-docker-repo/flask-app:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
