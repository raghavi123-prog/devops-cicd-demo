steps:
  # 1. Build the Flask Container Image tagged with Commit SHA
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-flask-image'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/demo-repo/flask-app:$COMMIT_SHA'
      - '.'

  # 2. Scan the Image for Vulnerabilities using Trivy
  - name: 'aquasec/trivy:latest'
    id: 'scan-image'
    args:
      - 'image'
      - '--severity'
      - 'CRITICAL'
      - '--exit-code'
      - '0'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/demo-repo/flask-app:$COMMIT_SHA'

  # 3. Push the Immutable Image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/demo-repo/flask-app:$COMMIT_SHA'

  # 4. Deploy Infrastructure & Run Automated Smoke Test
  - name: 'hashicorp/terraform:latest'
    id: 'terraform-dev-and-test'
    entrypoint: 'sh'
    timeout: '1200s'
    args:
      - '-c'
      - |
        set -e
        cd terraform/environments/dev
        echo "=== INITIALIZING TERRAFORM DEV ==="
        terraform init

        echo "=== INSTALLING CURL ==="
        apk add --no-cache curl

        echo "=== APPLYING DEV INFRASTRUCTURE ==="
        terraform apply -var="project_id=$PROJECT_ID" -lock=false -auto-approve

        echo "=== RETRIEVING SERVICE URI ==="
        SERVICE_URI=$$(terraform output -raw dev_cloud_run_uri 2>/dev/null || echo "")

        if [ -n "$$SERVICE_URI" ]; then
          echo "Testing endpoint: $$SERVICE_URI/health"
          for i in 1 2 3 4 5 6; do
            STATUS=$$(curl -s -o /dev/null -w "%{http_code}" "$$SERVICE_URI/health" || true)
            echo "Attempt $$i: Received HTTP status $$STATUS"
            if [ "$$STATUS" = "200" ]; then
              echo "=== SMOKE TEST PASSED: Service returned 200 OK ==="
              break
            fi
            sleep 5
          done

          if [ "$$STATUS" != "200" ]; then
            echo "=== SMOKE TEST FAILED: Service did not return 200 OK ==="
            terraform destroy -var="project_id=$PROJECT_ID" -lock=false -auto-approve
            exit 1
          fi
        else
          echo "ERROR: dev_cloud_run_uri output is empty or not found!"
          terraform destroy -var="project_id=$PROJECT_ID" -lock=false -auto-approve
          exit 1
        fi

        echo "=== TEARING DOWN DEV INFRASTRUCTURE ==="
        terraform destroy -var="project_id=$PROJECT_ID" -lock=false -auto-approve

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/demo-repo/flask-app:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
